name: workflows
on:
  push:
    branches:
      -develop
    pull-request:
      branches:
       -develop

jobs:
  build:
    runs-on: ubuntu latest

    steps:
    -name: checkout code
    uses: actions/checkout@v3

    -name: set up Node.js
    uses: actions/setup-node@v3
    
    -name: Install dependencies
    run: npm install

    -name: Run tests
    run: npm test
    